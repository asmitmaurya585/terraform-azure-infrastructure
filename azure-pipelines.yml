trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - 'terraform udhat/**'

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'sandbox'
    values:
      - dev
      - sandbox
      - preprod
      - prod
  - name: action
    displayName: 'Action'
    type: string
    default: 'plan_and_apply'
    values:
      - plan_only
      - plan_and_apply
      - destroy

variables:
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform udhat/Enviroment/${{ parameters.environment }}'
  - name: azureServiceConnection
    value: 'azure-service-connection'
  - name: resourceGroup
    value: 'rgamit'
  - name: storageAccount
    value: 'asmitstorage'
  - name: containerName
    value: 'asmitcon'
  - name: tfStateKey
    value: '${{ parameters.environment }}.terraform.tfstate'

stages:
  # ----------------------------------------------------
  # STAGE 1: Code Quality & Security Scanning
  # ----------------------------------------------------
  - stage: Lint_and_Security
    displayName: 'Linting & Security Scan'
    jobs:
      - job: Security_Scan
        displayName: 'Run TFLint and TFSec'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'

          - script: |
              echo "Installing TFLint and TFSec..."
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
            displayName: 'Install Security Tools'

          - script: |
              cd "$(workingDirectory)"
              echo "==> Running Terraform Format Check..."
              terraform fmt -check
              
              echo "==> Running TFLint..."
              tflint --init
              tflint
              
              echo "==> Running TFSec Scan..."
              tfsec . --tfvars-file terraform.tfvars
            displayName: 'Execute TFLint & TFSec Checks'

  # ----------------------------------------------------
  # STAGE 2: Terraform Plan
  # ----------------------------------------------------
  - stage: Terraform_Plan
    displayName: 'Terraform Plan (${{ parameters.environment }})'
    dependsOn: Lint_and_Security
    jobs:
      - job: Plan
        displayName: 'Terraform Init & Plan'
        steps:
          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(workingDirectory)'
              inlineScript: |
                set -e
                echo "==> Initializing Terraform Backend..."
                terraform init \
                  -backend-config="resource_group_name=$(resourceGroup)" \
                  -backend-config="storage_account_name=$(storageAccount)" \
                  -backend-config="container_name=$(containerName)" \
                  -backend-config="key=$(tfStateKey)"

                if [ "${{ parameters.action }}" == "destroy" ]; then
                  echo "==> Generating Terraform Destroy Plan..."
                  terraform plan -destroy -out=tfplan -var-file="terraform.tfvars"
                else
                  echo "==> Generating Terraform Execution Plan..."
                  terraform plan -out=tfplan -var-file="terraform.tfvars"
                fi

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan Artifact'
            inputs:
              targetPath: '$(workingDirectory)/tfplan'
              artifactName: 'tfplan-${{ parameters.environment }}'

  # ----------------------------------------------------
  # STAGE 3: Terraform Apply (Conditional)
  # ----------------------------------------------------
  - stage: Terraform_Apply
    displayName: 'Terraform Apply (${{ parameters.environment }})'
    dependsOn: Terraform_Plan
    condition: and(succeeded(), ne('${{ parameters.action }}', 'plan_only'))
    jobs:
      - deployment: Deploy_Infrastructure
        displayName: 'Deploy to ${{ parameters.environment }}'
        environment: '${{ parameters.environment }}-environment'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Terraform Plan Artifact'
                  inputs:
                    buildType: 'current'
                    artifactName: 'tfplan-${{ parameters.environment }}'
                    targetPath: '$(workingDirectory)'

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: '$(workingDirectory)'
                    inlineScript: |
                      set -e
                      echo "==> Initializing Terraform..."
                      terraform init \
                        -backend-config="resource_group_name=$(resourceGroup)" \
                        -backend-config="storage_account_name=$(storageAccount)" \
                        -backend-config="container_name=$(containerName)" \
                        -backend-config="key=$(tfStateKey)"

                      echo "==> Applying Terraform Plan..."
                      terraform apply -input=false tfplan
