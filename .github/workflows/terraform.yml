name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'terraform udhat/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'terraform udhat/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - dev
          - sandbox
          - preprod
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan_and_apply'
        type: choice
        options:
          - plan_only
          - plan_and_apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ----------------------------------------------------
  # JOB 1: Security & Quality Checks
  # ----------------------------------------------------
  security-and-lint:
    name: 'Security & Format Audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive "terraform udhat"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Run TFLint
        run: |
          cd "terraform udhat/Enviroment/${{ github.event.inputs.environment || 'sandbox' }}"
          tflint --init
          tflint

      - name: Run TFSec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: "terraform udhat/Enviroment/${{ github.event.inputs.environment || 'sandbox' }}"

  # ----------------------------------------------------
  # JOB 2: Terraform Plan
  # ----------------------------------------------------
  terraform-plan:
    name: 'Terraform Plan'
    needs: security-and-lint
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ENV_NAME: ${{ github.event.inputs.environment || 'sandbox' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          cd "terraform udhat/Enviroment/$ENV_NAME"
          terraform init \
            -backend-config="resource_group_name=rgamit" \
            -backend-config="storage_account_name=asmitstorage" \
            -backend-config="container_name=asmitcon" \
            -backend-config="key=$ENV_NAME.terraform.tfstate"

      - name: Terraform Plan
        run: |
          cd "terraform udhat/Enviroment/$ENV_NAME"
          terraform plan -out=tfplan -var-file="terraform.tfvars"

  # ----------------------------------------------------
  # JOB 3: Terraform Apply (Auto on Main Branch or Dispatch)
  # ----------------------------------------------------
  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event.inputs.action != 'plan_only'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'sandbox' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ENV_NAME: ${{ github.event.inputs.environment || 'sandbox' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init & Apply
        run: |
          cd "terraform udhat/Enviroment/$ENV_NAME"
          terraform init \
            -backend-config="resource_group_name=rgamit" \
            -backend-config="storage_account_name=asmitstorage" \
            -backend-config="container_name=asmitcon" \
            -backend-config="key=$ENV_NAME.terraform.tfstate"
          terraform apply -auto-approve -var-file="terraform.tfvars"
